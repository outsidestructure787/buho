<!DOCTYPE html>
<html lang="es">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Búho</title>
<meta name="description" content="Registro de sueño, tomas y pañales del bebé. Funciona sin conexión.">
<meta name="theme-color" content="#fbf6f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16141b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Búho">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
/* Búho · registro del bebé pensado para usarse medio dormido a las 3 de la mañana.
   Sin dependencias externas: todo funciona sin conexión. */
:root{color-scheme:light dark;}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root{
--bg:light-dark(#fbf6f0,#16141b);--card:light-dark(#fff,#221f29);--ink:light-dark(#2a2233,#efe9f3);--mut:light-dark(#7a7084,#a79fb0);--line:light-dark(#ece4da,#34303c);--on:light-dark(#fff,#16141b);
--sl:light-dark(#6c63d9,#a29cf2);--fd:light-dark(#d4583f,#f08a74);--pe:light-dark(#b88a06,#f0c445);--po:light-dark(#8a5a33,#c99466);--ot:light-dark(#1f8a88,#4cc0bd);--warn:light-dark(#b8560f,#f0a050)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
main{max-width:720px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) max(4vw,14px) calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sl);outline-offset:2px}
svg.i{width:26px;height:26px;fill:currentColor;flex:none}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
h1{font-size:32px;line-height:1.05;margin:0;font-weight:800}
.age{color:var(--mut);font-size:14px;margin-top:2px}
.sync{margin-left:auto;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px;text-align:right;background:none;border:0;padding:6px 4px;border-radius:10px;line-height:1.25}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}.dot.on{background:var(--ot)}.dot.warn{background:var(--warn)}.dot.err{background:var(--fd)}
.ib{background:none;border:0;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mut);flex:none}
.ib:hover{background:var(--line)}
h2{font-size:20px;margin:26px 0 10px;font-weight:800}
.run{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;color:var(--on);margin-bottom:10px}
.run.sleep{background:var(--sl)}.run.feed{background:var(--fd)}
.run small{display:block;font-size:14px;opacity:.9}
.run b{font-size:clamp(28px,8vw,40px);font-variant-numeric:tabular-nums;line-height:1.05;display:block;font-weight:800}
.run .stop{margin-left:auto;background:color-mix(in srgb,var(--on) 22%,transparent);border:0;border-radius:14px;padding:12px 16px;font-weight:800;color:inherit;min-height:52px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 14px}
.tile{background:var(--card);border-radius:16px;padding:10px 12px 12px;border-top:4px solid var(--c)}
.tile small{display:block;color:var(--mut);font-size:13px;font-weight:700}
.tile b{display:block;font-size:clamp(19px,5.4vw,24px);line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:800}
.tile span{display:block;font-size:13px;color:var(--mut);line-height:1.3;margin-top:2px}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act{border:0;border-radius:18px;background:var(--card);min-height:86px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--c);box-shadow:0 1px 0 var(--line),0 6px 16px -12px rgba(40,20,50,.35);transition:transform .12s}
.act span{color:var(--ink);font-weight:700;font-size:14px;line-height:1.15;text-align:center}
.act.big{grid-column:span 2;flex-direction:row;gap:10px;min-height:96px}
.act.full{grid-column:span 4;flex-direction:row;gap:10px;min-height:64px}
.act .sub{display:block;font-size:12px;font-weight:700;opacity:.85;font-style:normal}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0 14px}
.menu button{border:1px solid var(--line);background:var(--bg);border-radius:18px;min-height:96px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--c,var(--ink));font-weight:800}
.menu button span{color:var(--ink);font-size:15px;line-height:1.2;text-align:center}
.menu button.on{background:var(--c);border-color:var(--c);color:var(--on)}.menu button.on span{color:inherit}
.menu.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.menu .wide2{grid-column:1/-1;min-height:60px;flex-direction:row}
.list{display:flex;flex-direction:column;gap:6px;margin:4px 0 14px}
.list button{display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:none;min-height:54px;padding:6px 4px;text-align:left;font-weight:700;color:var(--c,var(--ink))}
.list button span{color:var(--ink)}
.act.on{background:var(--c);color:var(--on)}.act.on span{color:inherit}
.act:active{transform:scale(.96)}
.dbl{display:flex}.dbl svg{width:21px;height:21px}
.lt{font-size:20px;width:30px;height:30px;border-radius:50%;border:2.5px solid currentColor;display:grid;place-items:center;line-height:1;font-weight:800}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sum div{background:var(--card);border-radius:14px;padding:10px 12px}
.sum b{display:block;font-size:26px;line-height:1.1;color:var(--c);font-weight:800;white-space:nowrap}
.sum small{color:var(--mut);font-size:13px;font-weight:700}
.note{color:var(--mut);font-size:14px;margin:8px 2px 0}
.row{display:grid;grid-template-columns:50px minmax(0,1fr) 52px;gap:8px;align-items:center;margin-bottom:6px}
.dl{font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap}
.st{font-size:13px;color:var(--mut);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{position:relative;height:34px;background:var(--card);border-radius:8px;overflow:hidden;background-image:linear-gradient(90deg,transparent calc(25% - 1px),var(--line) calc(25% - 1px) 25%,transparent 25% calc(50% - 1px),var(--line) calc(50% - 1px) 50%,transparent 50% calc(75% - 1px),var(--line) calc(75% - 1px) 75%,transparent 75%)}
.bar i{position:absolute;display:block}
.sg{top:0;bottom:0;background:var(--sl);opacity:.8}
.mk.f{top:3px;height:14px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--fd)}
.mk.d{bottom:4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--c)}
.nowl{top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.axl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin-top:6px}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:-1px}
.leg span.s::before{border-radius:2px;width:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;min-height:40px;font-weight:700;font-size:14px}
.chips button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h3{font-size:15px;margin:18px 0 2px;font-weight:800}h3 small{color:var(--mut);font-weight:600;margin-left:6px}
.li{display:grid;grid-template-columns:10px 116px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 4px;min-height:50px}
.li:hover{background:var(--card)}
.cd{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tm{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.ds{line-height:1.3}.ds small{display:block;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.du{color:var(--mut);font-size:14px;white-space:nowrap;text-align:right}
.du em{font-style:normal;margin-left:6px;background:var(--line);border-radius:10px;padding:1px 7px;font-size:12px;color:var(--ink)}
.ds .dur{font-weight:800;color:var(--c);white-space:nowrap}.ds .dur.run{color:var(--mut);font-weight:700}
.du .pd{margin-left:6px;color:var(--warn)}
.empty{color:var(--mut);background:var(--card);border-radius:14px;padding:18px;text-align:center}
details.acc{margin-top:26px}
details.acc>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:12px;min-height:44px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary h2{margin:0;flex:1}
details.acc>summary::after{content:"";width:10px;height:10px;border-right:2.5px solid var(--mut);border-bottom:2.5px solid var(--mut);transform:rotate(45deg);margin:0 8px 4px 0;transition:transform .2s}
details.acc[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
details.acc>section{margin-top:10px}
.sec{border:1px solid var(--line);border-radius:16px;margin:10px 0;background:var(--bg)}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:54px;font-weight:800;font-size:17px;cursor:pointer}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2.5px solid var(--mut);border-bottom:2.5px solid var(--mut);transform:rotate(45deg);transition:transform .2s}
.sec[open]>summary::after{transform:rotate(-135deg)}
.sec>summary svg{color:var(--sl);width:22px;height:22px}
.sec>div{padding:2px 14px 14px}
.sec input,.sec select,.sec textarea{background:var(--card)}
.sec .seg button{background:var(--card)}
.visit{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:0;border-left:4px solid var(--ot);border-radius:16px;padding:12px 14px;margin-top:12px}
.visit svg{color:var(--ot);margin-top:2px}
.visit b{display:block;font-size:13px;color:var(--mut);font-weight:700}
.visit span{display:block;font-weight:800;line-height:1.3}
.visit small{display:block;color:var(--mut);font-size:13px;line-height:1.3}
.visit .vi+.vi{margin-top:8px}
.vlist{margin:4px 0 12px}
.vrow{padding:10px 2px;border-bottom:1px solid var(--line)}
.vrow b{display:block}.vrow small{display:block;color:var(--mut);font-size:14px}
.ov.center{align-items:center;padding:16px}
.ov.center .sheet{border-radius:24px;max-height:86vh;padding:6px 20px 20px;box-shadow:0 20px 50px -20px rgba(20,12,28,.6)}
a.wide{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.more{display:block;width:100%;margin-top:12px;border:1px dashed var(--line);background:none;border-radius:14px;min-height:46px;font-weight:700;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(20,12,28,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:6px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{margin-top:16px}
.f{display:block;margin-bottom:14px;font-size:14px;color:var(--mut);font-weight:700}
.f small{font-weight:600}
input,select,textarea{display:block;width:100%;margin-top:5px;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.seg button{flex:1 1 0;border:1px solid var(--line);background:var(--bg);border-radius:12px;min-height:46px;font-weight:700;color:var(--ink);padding:6px 8px}
.seg button.sel{background:var(--sl);border-color:var(--sl);color:var(--on)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btns button,.wide{border:1px solid var(--line);background:var(--bg);border-radius:14px;min-height:50px;padding:0 18px;font-weight:800}
.btns .pri{background:var(--sl);border-color:var(--sl);color:var(--on);flex:1}
.btns .dan{color:var(--fd);margin-left:auto}
.wide{width:100%;margin-bottom:8px}
.err{color:var(--fd);font-weight:700;min-height:1px;margin:0 0 6px}
.ok{color:var(--ot);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;min-height:46px}
.chk input{width:22px;height:22px;min-height:0;margin:0;flex:none}
.hint{color:var(--mut);font-size:14px;margin:0 0 14px}
.box{background:var(--bg);border-radius:14px;padding:12px 14px;margin:6px 0 16px;font-size:14px}
.box p{margin:4px 0 0;color:var(--mut)}
.ver{color:var(--mut);font-size:13px;text-align:center;margin:18px 0 0}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,160%);background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:6px;max-width:calc(100% - 24px);width:max-content;transition:transform .25s;z-index:20;font-weight:700;font-size:15px}
#toast.show{transform:translate(-50%,0)}
#toast button{background:color-mix(in srgb,var(--bg) 18%,transparent);border:0;color:inherit;border-radius:10px;min-height:42px;padding:0 12px;font-weight:800;flex:none}
#toast span{padding-right:6px}
@media(max-width:420px){.li{grid-template-columns:10px 106px minmax(0,1fr) auto;gap:8px}.tm{font-size:15px}.act span{font-size:13px}.sum b{font-size:22px}}
@media(prefers-reduced-motion:reduce){.act,#toast{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1 id="nm">Búho</h1><div class="age" id="age"></div></div>
    <button class="sync" id="sync" data-a="syncnow"></button>
    <button class="ib" data-a="settings" id="gear"></button>
  </header>
  <section id="now"></section>
  <section id="visits"></section>
  <h2 id="h-today"></h2>
  <section id="sum"></section>
  <h2 id="h-log"></h2>
  <section id="log"></section>
  <details class="acc" id="wk"><summary><h2 id="h-week"></h2></summary><section id="tl"></section></details>
</main>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

function act(a){
  const ev=all(),now=Date.now();

  if(a==='sleep'||a==='wake'){
    if(sl){upd(sl,{end:now});undoable(T('tWoke',{d:dur(now-sl.start)}),()=>upd(EV[sl.id],{end:null}))}
    else if(a==='sleep'){const r=add({type:'sleep',start:now,end:null});undoable(T('tSlept',{t:hm(now)}),()=>delRef(r))}}
  else if(a==='L'||a==='R'){
    if(!cfg.timeFeeds){const r=add({type:'feed',kind:'breast',side:a,start:now,end:now});undoable(T('tFeedAt',{s:SIDE(a),t:hm(now)}),()=>delRef(r));return}
    if(fd){upd(fd,{end:now});if(fd.side===a&&fd.kind==='breast'){undoable(T('tFeedDone',{d:dur(now-fd.start)}),()=>upd(EV[fd.id],{end:null}));return}}
    const r=add({type:'feed',kind:'breast',side:a,start:now,end:null});undoable(T('tBreastFrom',{s:SIDE(a),t:hm(now)}),()=>delRef(r))}
  else if(a==='feedstop'){if(fd){upd(fd,{end:now});undoable(T('tFeedDone',{d:dur(now-fd.start)}),()=>upd(EV[fd.id],{end:null}))}}
  else if(a==='pee'||a==='poo'||a==='both'){
    const r=add({type:'diaper',pee:a!=='poo',poo:a!=='pee',start:now});
    const lbl={pee:T('pee'),poo:T('poo'),both:T('peeAndPoo')}[a];
    undoable(T('tAt',{x:lbl,t:hm(now)}),()=>delRef(r),a==='pee'?null:{l:T('color'),f:()=>{const e=EV[r.id];if(e&&!e.del)openForm(e,false)}})}
  else if(a==='feedMenu'){const on=x=>fd&&fd.kind==='breast'&&fd.side===x;
    openMenu(T('pickFeed'),`<div class="menu">${['L','R'].map(x=>`<button data-m="${x}" class="${on(x)?'on':''}" style="--c:var(--fd)"><b class="lt">${x==='L'?'I':'D'}</b><span>${on(x)?T(x==='L'?'endL':'endR'):T(x==='L'?'btnL':'btnR')}</span></button>`).join('')}</div>`)}
  else if(a==='bottleMenu')openMenu(T('pickMilk'),`<div class="menu"><button data-m="bMat" style="--c:var(--fd)">${I.bottle}<span>${T('mMat')}</span></button><button data-m="bForm" style="--c:var(--fd)">${I.bottle}<span>${T('mForm')}</span></button></div>`);
  else if(a==='diaperMenu')openMenu(T('pickDiaper'),`<div class="menu three"><button data-m="pee" style="--c:var(--pe)">${I.drop}<span>${T('pee')}</span></button><button data-m="poo" style="--c:var(--po)">${I.poo}<span>${T('poo')}</span></button><button data-m="both" style="--c:var(--po)"><span class="dbl" style="color:var(--pe)">${I.drop}<i style="color:var(--po);display:flex">${I.poo}</i></span><span>${T('both2')}</span></button></div>`);
  else if(a==='notesMenu')openMenu(T('pickNote'),`<div class="list">${['note','weight','temp','med','height','head','spit','bath','cry'].map(k=>`<button data-m="sub:${k}" style="--c:var(--ot)">${k==='note'?I.pen:I.plus}<span>${T(SUBK[k][0])}</span></button>`).join('')}<button data-m="past" style="--c:var(--mut)">${I.clock}<span>${T('btnPast')}</span></button></div>`);
  else if(a==='bMat'||a==='bForm'){const milk=a==='bMat'?'materna':'formula';const r=add({type:'feed',kind:'bottle',milk,start:now});
    undoable(T('tBottleAt',{x:milk==='formula'?T('formula'):T('breastMilk'),t:hm(now)}),()=>delRef(r),{l:T('qtyBtn'),f:()=>{const e=EV[r.id];if(e&&!e.del)openForm(e,false)}})}
  else if(a&&a.startsWith('sub:'))openForm({type:'other',sub:a.slice(4),start:now},true);
  else if(a==='past')openForm({type:'feed',kind:'breast',side:'L',start:now-36e5,end:now-36e5+15*6e4},true);
  else if(a==='settings')openSettings();
  else if(a==='export')exportCsv();
  else if(a==='syncnow'){if(!LOC.url||!LOC.key)openSettings();else sync()}
  else if(a==='logAll'){filter='all';logN=100;openLog()}
  else if(a==='visits')openVisits();}

    <label class="chk"><input type="checkbox" data-c="timeFeeds" ${cfg.timeFeeds?'checked':''}>${T('timeFeeds')}</label>
    <p class="hint">${T('timeFeedsHint')}</p>
    <div class="f">${T('theme')}<div class="seg" data-grp="theme">${sel('theme','auto',th,T('thAuto'))}${sel('theme','light',th,T('thLight'))}${sel('theme','dark',th,T('thDark'))}</div></div>
    <p class="hint">${T('themeHint')}</p>
    <h3>${T('syncTitle')}</h3>
    <p class="hint">${T('syncHelp')}</p>
    <label class="f">${T('syncUrl')}<input data-c="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(LOC.url)}"></label>
    <label class="f">${T('syncKey')}<input data-c="key" autocomplete="off" spellcheck="false" value="${esc(LOC.key)}"></label>
    <label class="f">${T('pasteLink')}<input data-c="link" autocomplete="off" spellcheck="false" placeholder="https://…#cfg=…"></label>
    <p class="err" id="serr"></p>
    <button class="wide" data-s="test">${T('testSync')}</button>
    ${LOC.url&&LOC.key?`<button class="wide" data-s="share">${T('shareCfg')}</button><button class="wide" data-s="full">${T('fullSync')}</button>`:''}
    <h3>${T('exportTitle')}</h3><button class="wide" data-s="export">${T('exportCsv')}</button>
  </div></details>
  <div class="btns"><button class="pri" data-s="ssave">${T('save')}</button><button data-s="cancel">${T('cancel')}</button></div>
  <p class="ver">${T('version',{v:VERSION})}</p>`;
  $('#ov').classList.add('open');
  const lk=$('[data-c=link]');lk.addEventListener('input',()=>{const o=parseCfg(lk.value);if(o){$('[data-c=url]').value=o.url;$('[data-c=key]').value=o.key;lk.value=''}})}
$('#sheet').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b||mode!=='settings')return;
  b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))});
const grp=k=>{const b=document.querySelector(`[data-grp=${k}] .sel`);return b?b.dataset.v:''};
async function settingsClick(s,b){
  if(s==='ssave'){
    const n={name:$('[data-c=name]').value.trim().slice(0,40),birth:$('[data-c=birth]').value,sex:grp('sex'),timeFeeds:$('[data-c=timeFeeds]').checked,
      cal:{on:$('[data-c=calOn]').checked,id:$('[data-c=calId]').value.trim()||'primary',q:$('[data-c=calQ]').value.trim().slice(0,200),days:Math.min(180,Math.max(1,+$('[data-c=calDays]').value||30))}};
    LOC.me=$('[data-c=me]').value.trim().slice(0,24);LOC.theme=grp('theme')||'auto';applyTheme();
    const calChanged=JSON.stringify(n.cal)!==JSON.stringify(cfg.cal);
    closeSheet();
    const c=EV.cfg,cur={name:cfg.name,birth:cfg.birth,sex:cfg.sex,timeFeeds:cfg.timeFeeds,cal:cfg.cal};
    if(!c||c.del||JSON.stringify(cur)!==JSON.stringify(n)){const now=Date.now();EV.cfg={id:'cfg',type:'config',...n,start:now,u:Math.max(now,(c?.u||0)+1)};if(calChanged){CAL={at:0,items:[],err:'',name:''};saveCal();calForce=true}changed('cfg')}else{persist();render()}
    if(n.cal.on&&(!LOC.url||!LOC.key))setTimeout(()=>toast(T('calNeedSync')),400);else toast(T('tSettings'));return}
  if(s==='test'){
    const url=$('[data-c=url]').value.trim(),key=$('[data-c=key]').value.trim(),err=$('#serr');
    const changedSrc=url!==LOC.url||key!==LOC.key;
    LOC.url=url;LOC.key=key;if(changedSrc){SINCE=0;Object.keys(EV).forEach(id=>PEND.add(id))}persist();
    if(!url||!key){err.className='err';err.textContent='';setSync();return}
    err.className='ok';err.textContent=T('testing');b.disabled=true;
    const ok=await sync(changedSrc);b.disabled=false;
    err.className=ok?'ok':'err';err.textContent=ok?T('testOk'):lastErr;return}
  if(s==='share'){const link=cfgLink();
    try{if(navigator.share){await navigator.share({title:T('appName'),text:T('shareText'),url:link});return}}catch(e){if(e&&e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(link);toast(T('cfgCopied'))}catch(e){prompt(T('shareCfg'),link)}return}
  if(s==='full'){closeSheet();SINCE=0;await sync(true);return}
  if(s==='export')exportCsv()}

/* ================= Exportar ================= */
async function exportCsv(){
  const rows=[T('csvHead')];
  all().slice().reverse().forEach(e=>{const fin=timed(e)&&e.end!=null&&e.end>e.start;
    rows.push([new Date(e.start).toLocaleDateString(LANG),hm(e.start),fin?hm(e.end):'',fin?Math.round((e.end-e.start)/6e4):'',TYPE(e.type),desc(e),e.note||'',e.by||''])});
  const csv='﻿'+rows.map(r=>r.map(c=>{c=String(c);return/[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');
  const name='buho-'+toIn(Date.now()).slice(0,10)+'.csv';
  try{const file=new File([csv],name,{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return}catch(e){}
  try{await navigator.clipboard.writeText(csv);toast(T('tCsvCopied'))}catch(e){toast(T('tNoExport'))}}

/* ================= Arranque ================= */
$('#gear').innerHTML=I.gear;$('#gear').setAttribute('aria-label',T('settings'));
$('#h-today').textContent=T('today');$('#h-week').textContent=T('last7');$('#h-log').textContent=T('log');
loadLocal();
function applyHash(){const hc=location.hash.match(/cfg=([^&]+)/);if(!hc)return;
  const o=dec(hc[1]);history.replaceState(null,'',location.pathname+location.search);
  if(o){const ch=o.url!==LOC.url||o.key!==LOC.key;LOC.url=o.url;LOC.key=o.key;if(ch){SINCE=0;Object.keys(EV).forEach(id=>PEND.add(id))}persist();setTimeout(()=>{toast(T('cfgApplied'));if(!LOC.me)openSettings()},300);sync(ch)}
  else setTimeout(()=>toast(T('cfgBad')),300)}
applyHash();addEventListener('hashchange',applyHash);
render();
setInterval(tick,1000);
setInterval(()=>{if(!$('#ov').classList.contains('open'))render()},60000);
setInterval(()=>{if(document.visibilityState==='visible')sync()},30000);
addEventListener('online',()=>sync());addEventListener('offline',setSync);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){render();sync()}});
addEventListener('storage',e=>{if(e.key===K.ev){loadLocal();cache=null;render()}});
sync();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* Service worker: guarda la app en el móvil para abrirla sin conexión. */
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()});
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    const offer=w=>toast(T('tNewVersion'),[{l:T('update'),f:()=>w.postMessage('skip')}]);
    if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)offer(w)})});
    setInterval(()=>reg.update().catch(()=>{}),3600000);
  }).catch(()=>{})}
}
</script>
